#
# Sten-TTS-950M: half of Sten-TTS-1.7B, carved out of it by weight surgery and recovered by distillation from it.
# A variant recipe names the full model's recipe (`variant_of`) and takes from it everything about the data, the
# voices, the evaluation sets and the release gates; it adds how the model is cut (`compress`), how it learns from
# the full model (`train`), the parity margins it must hold against it, and where it is published.

name: sten-tts-950m
title: Sten-TTS-950M
variant_of: sten-tts-1.7b-v2.yaml        # relative to this file

teacher:                                 # the full model: the source of the surgery and the teacher of the recovery
  model: local/sten-tts-1.7b-v2          # its id in brain's model store
  title: Sten-TTS-1.7B
  repo: swedishembedded/sten-tts
  parameters: 1916676352                 # in its model.safetensors

compress:                                # stage `compress`: brain `speech_surgery` on the teacher
  max_parameters: 958000000              # in model.safetensors; the codec is shared and counted apart
  records: 128                           # training-shard records that calibrate the edits
  held_out_records: 128                  # validation-shard records each edit is measured on
  install_as: sten-tts-950m-pruned       # the unrecovered checkpoint, the starting point of the recovery
  corpus: inventory                      # the trim also keeps the tokens of every candidate utterance of every source
  plan:                                  # applied in brain's order: vocabulary, channels, layers
    - trim_vocabulary: {vocabulary: text}                                          # the tokens the texts use
    - select_channels: {dims: "talker.layers.*.mlp", keep: 2560, score: fisher}   # 2560 of 6144 channels in every Talker MLP
    - remove_layers: {stack: talker.layers, count: 4, by: kl, greedy: true}       # 4 Talker layers, chosen one at a time
  # Measured before recovery (held-out KL to the full model, 128 records): this plan 0.864; halving the MLPs and
  # removing the 6 layers that cost least alone, 1.085 at the same size; see the brain roadmap's compression ledger.

train:                                   # stage `train`: distillation from the teacher on the v2 shards
  install_as: sten-tts-950m-r3            # the third recovery run's name in the model store (names are never reused)
  epochs: 6                              # at most: held-out KL to the teacher picks the checkpoint and stops the run
  lr: 5.0e-5                             # at a global batch of 128; the best of 1e-5..4e-4 in 150-step probes
  weight_decay: 0.01
  warmup_fraction: 0.03
  batch_utterances: 16                   # per card: with the full model beside it, 32 utterances at 375 frames need ~123 GiB
  grad_accum: 2                          # 16 x 2 x 4 cards = 128 utterances a step
  max_frames: 375
  mtp_weight: 0.3
  streaming_fraction: 0.5
  eval_every: 100
  eval_batches: 16                       # 256 held-out records: 8 batches let noise stop the first run at step 3400
  patience: 10
  keep_best: true
  distill:                               # L = gt CE + T^2 KL(teacher || student) on codebook 0 and the 15 residual codebooks
    gt_weight: 1.0
    talker_kd_weight: 1.0
    mtp_kd_weight: 0.02
    hidden_kd_weight: 0.1
    hidden_kd_layers: [[6, 7], [12, 15], [18, 21], [24, 28]]   # the cut's residual streams and the full model's they came from
    kd_temperature: 1.0

evaluate:                                # the full recipe's evaluation and gates, plus parity with the full model
  parity:
    teacher_evaluation: teacher          # the full model's evaluate output (clips.parquet, report.json, sentences.json)
    cer_max_delta: 0.0025                # FLEURS CER at most this above the full model's
    similarity_max_drop: 0.01            # per voice, similarity at most this below
    identity_max_drop: 0.02              # per voice, nearest-voice accuracy at most this below
    failure_max_delta: 0.005             # failure rate at most this above
  speed:                                 # stage `speed`: one request at a time on one card, variant and full model
    sentences: 20                        # the first FLEURS evaluation sentences
    voice: astrid
    warmup: 2                            # requests before the timed ones

publish:
  subfolder: sten-tts-950m               # beside the full model in the same repository
