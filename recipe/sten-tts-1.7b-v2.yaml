#
# The Sten-TTS-1.7B v2 recipe: a larger, more varied corpus (read speech, debate, audiobook narration,
# English replay for code-switching), lively voices, and the best checkpoint by held-out loss.
# Paths are relative to the work directory each stage is given (--workdir).

name: sten-tts-1.7b-v2
seed: 20261125            # selection, splits and training draws; change it and you get another, equally valid run

base:
  repo: Qwen/Qwen3-TTS-12Hz-1.7B-Base
  revision: fd4b254389122332181a7c3db7f27e918eec64e3
  license: Apache-2.0

judge:                    # the recogniser that scores intelligibility; never trained here
  repo: Qwen/Qwen3-ASR-1.7B
  served_as: brain/qwen3asr  # the id brain serves its one Qwen3-ASR checkpoint under
  revision: 7278e1e70fe206f11671096ffdd38061171dd6e5

language:
  name: swedish           # the codec language row the release adds (config: talker_config.codec_language_id)
  init_from: [german, english]   # the new row starts as the mean of these rows of the base
  base_languages: [english]      # rows of the base the corpus also trains (LibriTTS-R), so English words stay English

sources:
  nst:
    repo: KTH/nst
    revision: d3c2c6283b824266b4a6fac10b7b9aae3bad4293
    license: CC0-1.0
    files: "train/data-*.arrow"       # all 101 shards (44 GB): audio and metadata share the files
    format: arrow-stream
  rixvox:
    repo: KBLab/rixvox-v2
    revision: 1f5f37f5ec8740eae318eeae7bf190074454d0d1
    license: ODC-BY-1.0
    attribution: >-
      Contains information from the dataset RixVox-v2 (https://huggingface.co/datasets/KBLab/rixvox-v2),
      made available under the ODC Attribution License, sourced from the Swedish Parliament's open data.
    files: [844, 943]                 # shard range data/rixvox_0844 .. 0943: the most recent ~100 shards of debates
    format: parquet
  fleurs:
    repo: google/fleurs
    revision: 70bb2e84b976b7e960aa89f1c648e09c59f894dd
    license: CC-BY-4.0
    files: "data/sv_se/*"             # train and dev splits train; the test split is evaluation only
    format: fleurs
  librivox:
    repo: felixmr1/librivox-tts-swedish
    revision: aa2e5e918bf426e8d5c5106ee3600116969e8c5e
    license: CC0-1.0
    files: "data/data.parquet"        # ~38 h of public-domain audiobook narration in 5-minute chunks, aligned by `segment`
    format: librivox-chunks
  libritts_r:
    repo: mythicinfinity/libritts_r
    revision: 0d1718db351207d5a493135a62d5ed8cc4733830
    license: CC-BY-4.0
    attribution: >-
      LibriTTS-R (2023, arXiv:2305.18802), derived from LibriTTS and LibriSpeech, CC-BY-4.0.
    files: "data/train.clean.100/*"   # English replay at 24 kHz, so English words in Swedish text stay English
    format: libritts-r

segment:                  # stage `segment`: the LibriVox chunks cut into checked utterances
  source: librivox
  min_seconds: 2.0
  max_seconds: 20.0
  min_pause_seconds: 0.25   # a pause: at least this long ...
  silence_db: 30.0          # ... this far below the chunk's speech level (95th percentile of 20 ms frame energy)
  max_cer: 0.10             # the recognition against its aligned span of the book text
  asr_language: Swedish     # the recogniser (the judge) is told the language

liveliness:               # stage `voices`: the liveliest NST speaker of each voice slot (sten_tts/voices.py has the formula)
  min_minutes: 20.0         # a candidate has at least this much eligible audio (25 min leaves 2-8 per slot)
  utterances: 40            # recordings measured per candidate, drawn by the seed
  weights: {f0_range: 0.35, f0_sd: 0.25, energy_sd: 0.25, syllable_rate: 0.15}   # of the z-scores among the same gender

selection:
  hours: 420.0                         # accepted training audio after every filter (the shards are cut at exactly this)
  # Shares of the hours: NST ~189 h, RixVox ~147 h, LibriVox ~34 h, FLEURS train+dev all of its ~8 h,
  # LibriTTS-R English ~42 h (10 %). A source that runs short leaves its shortfall to the others, in this order.
  share: {nst: 0.45, rixvox: 0.35, librivox: 0.08, fleurs: 0.02, libritts_r: 0.10}
  oversample: 1.15                     # select this much more before the audio filters drop clips (v1 lost 9 %)
  duration_seconds: {min: 1.5, max: 30.0}     # RixVox segments run to 30 s; 30 s is 375 frames
  nst:
    cap_minutes_per_speaker: 20.0      # auxiliary speakers; the named voices take all their clean audio
    min_words: 3
  rixvox:
    cap_minutes_per_speaker: 30.0      # ~700 speakers in the 100 shards; WER filtering leaves many with less
    max_wer_whisper: 0.10              # the protocol text and Whisper's transcript agree
    min_lang_prob_sv: 0.98
    text: whisper_transcription        # verbatim; the protocol text is edited for print
  librivox:
    cap_minutes_per_speaker: 300.0     # a LibriVox speaker is one audiobook's reader; nine books
  fleurs:
    cap_minutes_per_speaker: 1.0       # FLEURS names no readers: every recording is its own speaker
  libritts_r:
    cap_minutes_per_speaker: 20.0      # 247 speakers, ~13 min each on average
  held_out:
    unseen_speakers: {nst: 12, rixvox: 6, librivox: 1, libritts_r: 4}   # whole speakers kept out of training
    voice_test_utterances: 20               # per named voice, unseen texts
    validation_fraction: 0.01               # of the training speakers' utterances, for checkpoint choice

audio:
  silence_trim_db: -40.0               # trim leading/trailing audio below this level ...
  keep_margin_seconds: 0.15            # ... keeping this much of it
  max_clipped_fraction: 0.001
  min_snr_db: 15.0
  min_rms_dbfs: -40.0

# Twelve named voices, each an NST speaker chosen by `select` (the one with the most clean
# audio in its region and gender, ties broken by the seed). NST has no Finland Swedish
# speakers, so the last pair is Dalarna's.
voices:
  - {name: astrid, gender: female, region: Mellansverige}
  - {name: erik,   gender: male,   region: Mellansverige}
  - {name: linnea, gender: female, region: Stockholm med omnejd}
  - {name: viktor, gender: male,   region: Stockholm med omnejd}
  - {name: elsa,   gender: female, region: Göteborg med omnejd}
  - {name: oskar,  gender: male,   region: Göteborg med omnejd}
  - {name: maja,   gender: female, region: Västra sydsverige}
  - {name: nils,   gender: male,   region: Västra sydsverige}
  - {name: signe,  gender: female, region: Norrland}
  - {name: arvid,  gender: male,   region: Norrland}
  - {name: ingrid, gender: female, region: Dalarna med omnejd}
  - {name: axel,   gender: male,   region: Dalarna med omnejd}

train:
  install_as: sten-tts-1.7b-v2         # installed in brain's model store as local/sten-tts-1.7b-v2
  epochs: 6                            # at most: held-out loss picks the checkpoint and stops the run early
  lr: 2.0e-5                           # a global batch of 32 x ranks utterances (352 on 11 cards)
  weight_decay: 0.01
  warmup_fraction: 0.05                # of the steps, then a cosine decay
  batch_utterances: 32                 # per rank: a GH200's fastest batch at max_frames 375
  grad_accum: 1
  max_frames: 375                      # 30 s at 12.5 Hz
  mtp_weight: 0.3
  streaming_fraction: 0.5              # half the records in each text layout the release serves
  lr_multipliers: {new_rows: 5.0}
  eval_every: 100                      # held-out teacher-forced loss every this many steps
  eval_batches: 8
  patience: 4                          # stop once 4 evaluations in a row have not beaten the best
  keep_best: true                      # publish the best evaluation's parameters, not the last step's

evaluate:
  fleurs_sentences: 200                # FLEURS sv_se test sentences, read by every voice
  sets:                                # committed, hand-written sets, read by every voice and scored the same way (relative to this file)
    code_switching: evalsets/code-switching.tsv   # 60 Swedish sentences with English words, names and brands
    numbers: evalsets/numbers.tsv                 # 40 with numbers, dates, times, units and abbreviations
  seeds: [1, 2]
  judge_language: Swedish             # the recogniser is told the language: identification fails on synthesized speech
  gates:                               # the release passes only if every gate holds
    cer_over_floor_max: 0.03           # mean CER at most this above the recogniser's CER on the voices' real recordings
    cer_better_than_base: true         # below the base model's CER on the same texts (paired)
    voice_similarity_gap_max: 0.05     # per voice: real recordings' similarity to their centroid minus the clips' similarity
    voice_identity_accuracy_min: 0.90  # nearest-voice identification among the twelve
    failure_rate_max: 0.02             # clips that hit the length cap, are silent or loop

dataset:                               # stages `export` and `publish-dataset`: the training collection as a public dataset
  repo: swedishembedded/sten-tts-voice
  name: Sten-TTS Voice
  rows_per_shard: 6000                 # ~0.8 GB of FLAC per parquet file

publish:
  repo: swedishembedded/sten-tts          # the local mirror of this repository is given to `publish --hub-dir`
  private: false                        # public since 2026-11-25; a new repository is still created private and opened only after a complete upload
  family:                                 # the published compact variants the card lists, each read from its run's evidence (compact/<name>/)
    - sten-tts-950m.yaml                  # sten-tts-475m.yaml joins once its release is published
  comparison:                             # stage `samples`: every voice in every size on these evaluation sentences, played on the card
    seed: 1
    sentences: [fleurs:1829, cs01, nu01]  # a FLEURS test sentence, an English word in Swedish, numbers and a time
  samples:                                # the clips the model card plays: evaluation clips, unpicked (stage `samples`)
    seed: 1                               # the evaluation seed whose take is used
    order: [axel, astrid, erik, linnea, viktor, elsa, oskar, maja, nils, signe, arvid, ingrid]
