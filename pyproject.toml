[project]
name = "sten-tts"
version = "0.1.0"
description = "End-to-end recipe that trains the Swedish Sten-TTS-1.7B speech model on brain"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "numpy>=1.26",
    "pyarrow>=15",
    "soundfile>=0.12",
    "soxr>=0.3",
    "pyyaml>=6",
    "huggingface_hub>=0.34",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
sten-tts = "sten_tts.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sten_tts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
